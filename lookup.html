<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Stock Lookup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centred desk-width column: data source bar, a large search field, then the answer. Same identity as Stock Scanner. */
:root {
  --bg: #e7ecef;
  --surface: #f9fbfc;
  --ink: #13212c;
  --muted: #52636f;
  --line: #c3cdd5;
  --accent: #f2b705;
  --on-accent: #1c1600;
  --bad: #b2431d;
  --bad-bg: #f7dcd2;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171d; --surface: #18242d; --ink: #e7eef3; --muted: #94a5b2; --line: #2d3d49;
    --accent: #f2b705; --on-accent: #1c1600; --bad: #e0764c; --bad-bg: #47231a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171d; --surface: #18242d; --ink: #e7eef3; --muted: #94a5b2; --line: #2d3d49;
  --accent: #f2b705; --on-accent: #1c1600; --bad: #e0764c; --bad-bg: #47231a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 28px 48px;
}
.app { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-bottom: 3px solid var(--ink); padding-bottom: 8px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; margin: 0;
  text-transform: uppercase; letter-spacing: 0.02em; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.source { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border: 1.5px dashed var(--line); border-radius: 4px; padding: 14px 16px; background: var(--surface); }
.source.drag { border-color: var(--accent); border-style: solid; }
.source-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.source-name { font-family: var(--font-data); font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.source-meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.source-actions { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: 0.05em; text-transform: uppercase;
  min-height: 44px; padding: 8px 16px; border-radius: 4px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
}
button.primary { background: var(--ink); color: var(--bg); }
button.link { border: 0; background: none; padding: 0 2px; min-height: 0; font-family: var(--font-data);
  font-size: 15px; text-transform: none; letter-spacing: 0; text-decoration: underline; color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.search { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
input[type="text"] {
  font-family: var(--font-data); font-size: 30px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink);
  background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 14px 16px; width: 100%;
}
input::placeholder { color: var(--muted); opacity: 0.7; font-weight: 500; }
.connect { display: flex; flex-direction: column; gap: 6px; }
.connect .row { display: flex; gap: 8px; }
.connect .row input { flex: 1; min-width: 0; }
#api { font-size: 15px; font-weight: 500; letter-spacing: 0; padding: 10px 12px; border-width: 1.5px; }
.live { font-family: var(--font-body); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--surface); background: var(--ink); border-radius: 3px; padding: 1px 6px; margin-left: 6px; }
.result { display: flex; flex-direction: column; gap: 14px; min-height: 120px; }
.answer { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.tag { display: inline-flex; align-items: baseline; gap: 8px; font-family: var(--font-data); font-weight: 700; font-size: 34px;
  background: var(--accent); color: var(--on-accent); border: 2px solid var(--on-accent); border-radius: 4px; padding: 6px 16px;
  letter-spacing: 0.06em; }
.tag small { font-size: 16px; font-weight: 500; letter-spacing: 0; }
.lead { margin: 0; font-size: 18px; }
.lead b { font-family: var(--font-data); }
.hint { margin: 0; color: var(--muted); font-size: 15px; }
.miss { margin: 0; padding: 12px 14px; border-radius: 4px; background: var(--bad-bg); border-left: 5px solid var(--bad); font-weight: 500; }
.similar { display: flex; flex-direction: column; gap: 8px; }
.similar ul { list-style: none; margin: 0; padding: 0; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); }
.similar li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-family: var(--font-data); font-size: 15px; font-variant-numeric: tabular-nums; }
.similar li:last-child { border-bottom: 0; }
.similar li span { color: var(--muted); overflow-wrap: anywhere; text-align: right; }
.example { font-family: var(--font-body); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--on-accent); background: var(--accent); border-radius: 3px; padding: 1px 6px; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Stock Lookup</h1>
    <span class="source-meta" id="count"></span>
  </header>

  <div class="source" id="source">
    <div class="source-info">
      <span class="source-name" id="source-name">No stock list opened</span>
      <span class="source-meta" id="source-meta">Open the Excel file exported from Stock Scanner, or drop it here.</span>
    </div>
    <div class="source-actions">
      <button type="button" id="share">Shared list</button>
      <button type="button" class="primary" id="open">Open Excel file</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </div>
  </div>

  <div class="connect" id="connect" hidden>
    <label for="api">Shared list address (Google Sheet web app)</label>
    <div class="row">
      <input type="text" id="api" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
      <button type="button" class="primary" id="api-save">Connect</button>
    </div>
    <p class="hint" id="api-msg">Paste the web app address of the shared Google Sheet. The list then updates every minute.</p>
  </div>

  <div class="search">
    <label for="q">Part number</label>
    <input type="text" id="q" maxlength="15" placeholder="Type a part number" autocomplete="off" spellcheck="false">
  </div>

  <div class="result" id="result" aria-live="polite"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "stock-lookup-data";
  var data = null;   // {name, exported, rows:[{part, position}], example}

  function esc(s) { var d = document.createElement("span"); d.textContent = s; return d.innerHTML; }
  function norm(s) { return String(s == null ? "" : s).trim().toUpperCase(); }
  // Comparison key: letters and digits only, so spaces, hyphens, dots and invisible characters don't block a match.
  function key(s) { return String(s == null ? "" : s).toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  // All-digit part numbers also match without leading zeros (Excel drops them when it stores the cell as a number).
  function same(a, b) {
    if (a === b) return true;
    return /^[0-9]+$/.test(a) && /^[0-9]+$/.test(b) && a.replace(/^0+/, "") === b.replace(/^0+/, "");
  }
  function cellText(v) {
    if (typeof v === "number") {
      return Number.isInteger(v) ? v.toLocaleString("en-US", { useGrouping: false, maximumFractionDigits: 0 }) : String(v);
    }
    return String(v == null ? "" : v);
  }

  /* ---------- loading the exported file ---------- */
  function parseSheet(aoa) {
    var rows = [], exported = "";
    aoa.forEach(function (r, i) {
      var a = cellText(r[0]).trim(), b = cellText(r[1]).trim();
      if (!a && !b) return;
      if (key(a) === "PARTNUMBER") return;                       // header row
      if (key(a) === "EXPORTED") { exported = b; return; }       // last row: export date and time
      if (a && b) rows.push({ part: a, position: b });
    });
    return { rows: rows, exported: exported };
  }
  function openFile(file) {
    if (!file) return;
    if (!window.XLSX) { showError("The Excel reader did not load. Check the internet connection and reload the page."); return; }
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var wb = XLSX.read(new Uint8Array(fr.result), { type: "array" });
        var parsed = { rows: [], exported: "" };
        for (var i = 0; i < wb.SheetNames.length && !parsed.rows.length; i++) {   // first sheet that has rows
          parsed = parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { header: 1, raw: true, defval: "" }));
        }
        if (!parsed.rows.length) { showError(file.name + " has no part numbers in columns A and B."); return; }
        clearInterval(timer);   // a file replaces the live shared list until Shared list is clicked again
        data = { name: file.name, exported: parsed.exported, rows: parsed.rows, example: false };
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
        renderSource(); search(); $("q").focus();
      } catch (e) {
        showError(file.name + " could not be read. Open the .xlsx file exported from Stock Scanner.");
      }
    };
    fr.onerror = function () { showError(file.name + " could not be opened."); };
    fr.readAsArrayBuffer(file);
  }
  /* ---------- shared list (Google Sheet web app) ---------- */
  var API_STORE = "stock-lookup-api", api = "", timer = null;
  function getApi() { try { return localStorage.getItem(API_STORE) || ""; } catch (e) { return ""; } }
  function setApi(u) { try { if (u) localStorage.setItem(API_STORE, u); else localStorage.removeItem(API_STORE); } catch (e) {} }
  function validApi(u) { return /^https:\/\/script\.google\.com\/.+\/exec$/.test(u); }
  async function loadShared() {
    try {
      var j = await (await fetch(api + "?t=" + Date.now())).json();
      if (!j || !j.ok) throw new Error("error");
      data = { name: "Shared list", shared: true, updated: Date.now(), rows: (j.rows || []).map(function (r) {
        return { part: String(r.part), position: String(r.position) }; }) };
      $("connect").hidden = true;
    } catch (e) {
      if (data && data.shared) data.failedAt = Date.now();
      else { showError("The shared list could not be reached. Check the address and the internet connection."); return; }
    }
    renderSource(); search();
  }
  function connectShared() {
    clearInterval(timer);
    loadShared();
    timer = setInterval(function () { if (!document.hidden) loadShared(); }, 60000);
  }

  function loadExample() {
    data = { name: "Example data", exported: "", example: true, rows: [
      { part: "AB12345XYZ", position: "12A34B" }, { part: "AB12345XYZ", position: "12A34B" },
      { part: "AB12345XYZ", position: "07C02A" }, { part: "AB12399", position: "03B11C" },
      { part: "7731004", position: "15D08A" }, { part: "KX900L2", position: "01A01A" } ] };
    renderSource(); search(); $("q").focus();
  }

  /* ---------- rendering ---------- */
  function hm(t) { var d = new Date(t), two = function (x) { return (x < 10 ? "0" : "") + x; }; return two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds()); }
  function renderSource() {
    if (!data) return;
    $("source-name").innerHTML = esc(data.name) + (data.example ? '<span class="example">Example</span>' : "") + (data.shared ? '<span class="live">Live</span>' : "");
    $("source-meta").textContent = data.shared
      ? (data.failedAt ? "Could not reach the shared list at " + hm(data.failedAt) + ". Showing the list from " + hm(data.updated) + ". Retrying every minute."
                       : "Updated " + hm(data.updated) + ". Refreshes every minute.")
      : data.example
      ? "Sample rows to try the search. Open your exported Excel file to use real stock."
      : (data.exported ? "Exported " + data.exported : "Export time not in file") + ". Open a newer export to refresh.";
    $("count").textContent = data.rows.length + (data.rows.length === 1 ? " row" : " rows");
  }
  function showError(text) { $("result").innerHTML = '<p class="miss">' + esc(text) + "</p>"; }
  function search() {
    var out = $("result"), q = key($("q").value);
    if (!data) {
      out.innerHTML = '<p class="hint">Open the Excel file exported from Stock Scanner, then type a part number to see its stock position. ' +
        'No file at hand? <button type="button" class="link" id="try">Try example data</button></p>';
      return;
    }
    if (!q) { out.innerHTML = '<p class="hint">Type a part number. Results appear as you type.</p>'; return; }
    var exact = {}, order = [], similar = {};
    data.rows.forEach(function (r) {
      var p = key(r.part);
      if (same(p, q)) {
        var k = norm(r.position);
        if (!exact[k]) { exact[k] = { position: r.position, n: 0 }; order.push(k); }
        exact[k].n++;
      } else if (p.indexOf(q) !== -1) {
        (similar[p] = similar[p] || { part: r.part, pos: [] }).pos.push(r.position);
      }
    });
    var html = "";
    if (order.length) {
      var total = order.reduce(function (s, k) { return s + exact[k].n; }, 0);
      html += '<p class="lead"><b>' + esc(q) + "</b> is stored at " + (order.length === 1 ? "1 position" : order.length + " positions") +
        (total > order.length ? " (" + total + " pieces)" : "") + ":</p>";
      html += '<div class="answer">' + order.map(function (k) {
        return '<span class="tag">' + esc(exact[k].position) + (exact[k].n > 1 ? "<small>× " + exact[k].n + "</small>" : "") + "</span>";
      }).join("") + "</div>";
    } else {
      html += '<p class="miss">' + esc(q) + " is not in this stock list.</p>";
    }
    var sim = Object.keys(similar).sort().slice(0, 10);
    if (sim.length) {
      html += '<div class="similar"><h2>Part numbers containing ' + esc(q) + "</h2><ul>" + sim.map(function (k) {
        var s = similar[k];
        return '<li><button type="button" class="link" data-part="' + esc(s.part) + '">' + esc(s.part) + "</button><span>" +
          esc(s.pos.filter(function (v, i, a) { return a.indexOf(v) === i; }).join(", ")) + "</span></li>";
      }).join("") + "</ul></div>";
    }
    out.innerHTML = html;
  }

  /* ---------- wiring ---------- */
  $("open").addEventListener("click", function () { $("file").click(); });
  $("share").addEventListener("click", function () {
    if (api && !(data && data.shared)) { connectShared(); return; }
    $("connect").hidden = !$("connect").hidden;
    $("api").value = api;
    if (!$("connect").hidden) $("api").focus();
  });
  $("api-save").addEventListener("click", function () {
    var u = $("api").value.trim();
    if (!validApi(u)) { $("api-msg").textContent = "This is not a Google web app address. It starts with https://script.google.com/ and ends with /exec."; return; }
    api = u; setApi(u); connectShared();
  });
  $("file").addEventListener("change", function () { openFile(this.files && this.files[0]); this.value = ""; });
  $("q").addEventListener("input", function () {
    var v = this.value.replace(/[^A-Za-z0-9]/g, "").slice(0, 15);
    if (v !== this.value) this.value = v;
    search();
  });
  $("result").addEventListener("click", function (e) {
    var t = e.target;
    if (t.id === "try") { loadExample(); return; }
    if (t.getAttribute && t.getAttribute("data-part")) { $("q").value = t.getAttribute("data-part"); search(); $("q").focus(); }
  });
  var src = $("source");
  ["dragenter", "dragover"].forEach(function (ev) {
    src.addEventListener(ev, function (e) { e.preventDefault(); src.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    src.addEventListener(ev, function (e) { e.preventDefault(); src.classList.remove("drag"); });
  });
  src.addEventListener("drop", function (e) { openFile(e.dataTransfer && e.dataTransfer.files[0]); });

  try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.rows && saved.rows.length) data = saved; } catch (e) {}
  if (window.claude && typeof window.claude.use === "function") {
    $("share").hidden = true;   // inside Claude the page cannot reach other websites
  } else {
    try {   // a link like stock-lookup.html?api=<address> saves the shared list address on this PC
      var fromLink = new URLSearchParams(location.search).get("api");
      if (fromLink && validApi(fromLink)) { setApi(fromLink); history.replaceState(null, "", location.pathname); }
    } catch (e) {}
    api = getApi();
    if (api) connectShared();
  }
  renderSource();
  search();
  $("q").focus();
})();
</script>
</body></html>
